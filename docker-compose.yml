version: '3.8'

services:
  app:
    image: php:8.2-apache
    container_name: php_app
    restart: always
    volumes:
      - .:/var/www/html
    ports:
      - "8080:80"
    networks:
      - app_network

  node:
    image: node:18
    container_name: node_service
    working_dir: /app
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: tail -f /dev/null
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
